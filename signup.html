<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign Up - Vandana</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Vandana CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        h1 {
            letter-spacing: 3px;
        }

        .error-message {
            color: red;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <header id="mainHeader">
        <h1>VANDANA</h1>
        <p style="font-style: italic;">keep what's sacred close</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="#">New</a>
        <a href="#">Collections</a>
        <a href="#">Apparel</a>
        <a href="#">Home & Decor</a>
        <a href="#">About</a>
        <a href="signup.html">Sign Up</a>
    </nav>

    <main>

        <section class="container my-5">

            <h2 class="text-center mb-4">User Signup</h2>

            <form onsubmit="return validateForm()">

                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label">Username:</label>

                    <input type="text"
                           class="form-control"
                           id="username"
                           placeholder="Enter username"
                           onfocusout="validate(this)">

                    <p id="usernameError" class="error-message"></p>
                </div>


                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           placeholder="Enter email"
                           onfocusout="validate(this)">

                    <p id="emailError" class="error-message"></p>
                </div>


                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password:</label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           placeholder="Enter password"
                           onfocusout="validate(this)">

                    <p id="passwordError" class="error-message"></p>
                </div>


                <!-- Confirm Password -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password:</label>

                    <input type="password"
                           class="form-control"
                           id="confirmPassword"
                           placeholder="Confirm password"
                           onfocusout="validate(this)">

                    <p id="confirmPasswordError" class="error-message"></p>
                </div>


                <button type="submit" class="btn btn-primary">Sign Up</button>

            </form>

        </section>

    </main>


    <footer>
        <p>About | Contact | Shipping | Instagram</p>
        <p>&copy; 2026 Vandana. All rights reserved.</p>
    </footer>



    <!-- JavaScript Validation -->
    <script>

        function validate(obj) {

            var errorMessage = document.getElementById(obj.id + "Error");

            
            errorMessage.innerHTML = "";
            obj.style.borderColor = "";


            
            if (obj.value.trim() == "") {

                errorMessage.innerHTML = "Field is required";
                obj.style.borderColor = "red";

                return false;
            }


            
            if (obj.id == "email") {

                var emailFormat = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailFormat.test(obj.value)) {

                    errorMessage.innerHTML = "Please enter a valid email address";
                    obj.style.borderColor = "red";

                    return false;
                }
            }


            
            if (obj.id == "confirmPassword") {

                var password = document.getElementById("password").value;

                if (obj.value != password) {

                    errorMessage.innerHTML = "Passwords do not match";
                    obj.style.borderColor = "red";

                    return false;
                }
            }


            return true;
        }



        function validateForm() {

            var username = document.getElementById("username");
            var email = document.getElementById("email");
            var password = document.getElementById("password");
            var confirmPassword = document.getElementById("confirmPassword");


            var usernameValid = validate(username);
            var emailValid = validate(email);
            var passwordValid = validate(password);
            var confirmPasswordValid = validate(confirmPassword);


            
            if (usernameValid &&
                emailValid &&
                passwordValid &&
                confirmPasswordValid) {

                return true;
            }


            return false;
        }

    </script>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>

</body>

</html>
